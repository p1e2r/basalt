[package]
name = "basalt-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Clean-room Rust client for Minecraft Java 26.2 servers"

[dependencies]
anyhow.workspace = true
tokio.workspace = true
uuid.workspace = true
serde_json.workspace = true
log.workspace = true
env_logger.workspace = true
md-5.workspace = true
basalt-protocol = { path = "../protocol" }
basalt-nbt = { path = "../nbt" }
basalt-data = { path = "../data" }
basalt-game = { path = "../game" }
wgpu = { version = "22", default-features = false, features = ["wgsl", "vulkan-portability", "metal", "dx12", "webgl"] }
winit = { version = "0.30", default-features = false, features = ["x11", "rwh_06"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
png = "0.17"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.29"
pollster = "0.3"
serde.workspace = true
# pure-Rust Ogg Vorbis decoder for the launcher asset store sounds
lewton = "0.10"

# audio output: on by default on macOS/Windows; on Linux behind `--features audio` (needs ALSA headers)
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
rodio = { version = "0.20", default-features = false }
[target.'cfg(not(any(target_os = "macos", target_os = "windows")))'.dependencies]
rodio = { version = "0.20", default-features = false, optional = true }

[features]
wayland = ["winit/wayland"]
audio = ["dep:rodio"]
