# Release builds of the Basalt binaries on Windows, macOS (Apple silicon) and Linux, plus the
# GPU-free unit tests, with the binaries uploaded as artifacts.
#
# Game data: crates/data and crates/world generate their tables at build time from ./data, which is
# produced by Mojang's own data generator. CI downloads the official server jar and runs it
# (`cargo xtask extract-data`, needs Java 25); nothing from Mojang is committed or uploaded
# (the artifacts only contain Basalt's own binaries).
name: build

on:
  push:
  pull_request:

env:
  MC_VERSION: "26.2"
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
            features: ""
          - os: macos-14
            target: aarch64-apple-darwin
            ext: ""
            features: ""
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
            # audio output is opt-in on Linux (rodio -> alsa-sys needs libasound2-dev)
            features: "--features basalt-client/audio"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # winit (x11 feature) and wgpu (vulkan) load libX11/libxkbcommon/libvulkan at runtime with dlopen,
      # so only the build-time probes are needed: pkg-config (x11-dl, alsa-sys) and the ALSA headers.
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libx11-dev libxkbcommon-dev
      - name: Cache generated game data
        id: data
        uses: actions/cache@v4
        with:
          path: |
            data
            vanilla/server.jar
          key: mcdata-${{ env.MC_VERSION }}-${{ hashFiles('xtask/src/extract_data.rs') }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Extract game data (downloads the official server jar)
        if: steps.data.outputs.cache-hit != 'true'
        run: cargo xtask extract-data
      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }} -p basalt-server -p basalt-client -p basalt-probe -p basalt-check ${{ matrix.features }}
      # tests that need ./data run here (it was just generated); tests that need a vanilla world, the
      # client jar or a GPU skip cleanly when those are missing
      - name: Unit tests
        run: cargo test --workspace --target ${{ matrix.target }}
      - name: Collect binaries
        run: |
          mkdir -p dist
          for b in basalt-server basalt-client basalt-probe basalt-check; do
            cp "target/${{ matrix.target }}/release/${b}${{ matrix.ext }}" dist/
          done
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: basalt-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
