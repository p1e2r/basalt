[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
flate2 = "1"
uuid = { version = "1", features = ["v3", "v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"
md-5 = "0.10"
rand = "0.8"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
